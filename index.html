<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sunny Chen</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 20% 30%, rgb(81 104 91 / 15%) 0 0.65px, transparent 0.75px),
                radial-gradient(circle at 70% 60%, rgb(81 104 91 / 11%) 0 0.55px, transparent 0.65px),
                #f4f6f2;
            background-size: 4px 4px, 5px 5px, auto;
            color: #111114;
        }

        .page {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 48px 20px 54px;
        }

        .card {
            position: relative;
            width: min(310px, calc(100vw - 40px));
            min-height: 492px;
            overflow: hidden;
            padding: 50px 33px 27px;
            border-radius: 11px;
            background:
                linear-gradient(rgb(216 224 211 / 72%), rgb(216 224 211 / 72%)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E");
            background-size: auto, 90px 90px;
            box-shadow:
                0 18px 45px rgb(25 25 25 / 10%),
                0 2px 8px rgb(25 25 25 / 5%);
            text-align: center;
        }

        .contact-view {
            display: none;
        }

        .card.show-contact .home-view {
            display: none;
        }

        .card.show-contact {
            min-height: 0;
        }

        .card.show-contact .contact-view {
            display: block;
        }

        .portrait-link {
            display: block;
            width: 243px;
            max-width: 100%;
            aspect-ratio: 243 / 294;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 14px;
            background: #121820;
        }

        .portrait {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lock-button {
            display: grid;
            width: 24px;
            height: 24px;
            margin: 20px auto 8px;
            place-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: #12151a;
            cursor: pointer;
        }

        .lock-button svg {
            width: 17px;
            height: 17px;
            stroke-width: 2.2;
        }

        .lock-button:focus-visible,
        .back-button:focus-visible,
        a:focus-visible {
            outline: 2px solid #101014;
            outline-offset: 5px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 1.1px;
            font-weight: 800;
        }

        .home-view h1 {
            font-size: 18px;
            letter-spacing: 1.4px;
        }

        .home-view h1 em {
            font-size: inherit;
            font-weight: 800;
        }

        .subtitle {
            margin: 10px 0 16px;
            font-size: 11px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 2.1px;
            text-align: center;
        }

        .divider {
            width: 100%;
            height: 1.5px;
            margin: 0 auto 15px;
            background: #15171a;
        }

        .hint {
            margin: 0;
            font-size: 11px;
            letter-spacing: 1.3px;
        }

        .contact-view {
            min-height: 0;
            text-align: left;
        }

        .contact-title {
            margin: 0 0 22px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }

        .contact-list {
            display: grid;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .contact-list li {
            border-top: 1.5px solid #15171a;
        }

        .contact-list li:last-child {
            border-bottom: 1.5px solid #15171a;
        }

        .contact-list a,
        .contact-list li>span {
            display: flex;
            min-height: 36px;
            align-items: center;
            justify-content: space-between;
            color: #101014;
            text-decoration: none;
        }

        .contact-label {
            font-size: 11px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .contact-value {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .back-button {
            display: block;
            margin: 19px auto 0;
            padding: 8px 12px;
            border: 1.5px solid #15171a;
            border-radius: 0;
            background: transparent;
            color: #101014;
            font: 700 12px/1 Helvetica, Arial, sans-serif;
            letter-spacing: 1.2px;
            cursor: pointer;
        }

        @media (max-width: 680px) {
            .page {
                align-items: start;
                padding: 24px 14px 48px;
            }

            .card {
                width: min(310px, calc(100vw - 28px));
                min-height: 492px;
                padding: 50px 33px 27px;
            }

            .portrait-link {
                width: 100%;
            }

            .lock-button {
                margin-top: 8px;
            }

            .contact-view {
                min-height: 0;
            }

            .contact-list a,
            .contact-list li>span {
                align-items: flex-start;
                flex-direction: column;
                justify-content: center;
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <article class="card" id="card">
            <section class="home-view" aria-label="Sunny Chen senior will">
                <a class="portrait-link" href="https://www.tiktok.com/@laefeysun" target="_blank" rel="noopener"
                    aria-label="Visit Sunny's TikTok">
                    <img class="portrait" src="sunny-contact.jpg" alt="An illustrated couple embracing">
                </a>

                <button class="lock-button" id="lockButton" type="button" aria-label="Show contact information"
                    aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="1.5"></rect>
                        <path d="M7.5 10V7a4.5 4.5 0 0 1 9 0v3"></path>
                    </svg>
                </button>

                <h1>sunny chen<em>!</em></h1>
                <p class="subtitle">1143725</p>
                <div class="divider"></div>
                <p class="hint">click on the lock.</p>
            </section>

            <section class="contact-view" aria-label="Contact information" aria-hidden="true">
                <h1 class="contact-title">sunny chen<em>!</em></h1>
                <ul class="contact-list">
                    <li><span><span class="contact-label">number</span><span
                                class="contact-value">0902-182-635</span></span></li>
                    <li><a href="mailto:sunnycnchen@gmail.com"><span class="contact-label">email</span><span
                                class="contact-value">sunnycnchen@gmail.com</span></a></li>
                    <li><a href="https://www.tiktok.com/@laefeysun" target="_blank" rel="noopener"><span
                                class="contact-label">tiktok</span><span class="contact-value">laefeysun</span></a></li>
                    <li><a href="https://www.instagram.com/sunnysienchen" target="_blank" rel="noopener"><span
                                class="contact-label">instagram</span><span
                                class="contact-value">sunnysienchen</span></a></li>
                </ul>
                <button class="back-button" id="backButton" type="button">back</button>
            </section>
        </article>
    </main>

    <script>
        const card = document.getElementById("card");
        const lockButton = document.getElementById("lockButton");
        const backButton = document.getElementById("backButton");
        const contactView = card.querySelector(".contact-view");

        function showContact(show) {
            card.classList.toggle("show-contact", show);
            lockButton.setAttribute("aria-expanded", String(show));
            contactView.setAttribute("aria-hidden", String(!show));
            if (!show) lockButton.focus();
        }

        lockButton.addEventListener("click", () => showContact(true));
        backButton.addEventListener("click", () => showContact(false));
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && card.classList.contains("show-contact")) {
                showContact(false);
            }
        });
    </script>
</body>

</html>
