<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Chen | Personal Profile</title>
    <style>
        :root {
            --background: #070a12;
            --panel: #0c121e;
            --cyan: #45f3ff;
            --pink: #ff477e;
            --lime: #d7ff5f;
            --text: #e6f4f7;
            --muted: #91a7b5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
            background:
                radial-gradient(ellipse at 18% 20%, rgba(255, 71, 126, 0.13), transparent 28rem),
                radial-gradient(ellipse at 82% 78%, rgba(69, 243, 255, 0.12), transparent 30rem),
                linear-gradient(rgba(69, 243, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(69, 243, 255, 0.035) 1px, transparent 1px),
                var(--background);
            background-size: auto, auto, 42px 42px, 42px 42px, auto;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            width: 18rem;
            height: 18rem;
            border: 1px solid rgba(69, 243, 255, 0.16);
            box-shadow: 0 0 50px rgba(69, 243, 255, 0.06), inset 0 0 50px rgba(69, 243, 255, 0.04);
            transform: rotate(45deg) skew(-8deg, -8deg);
        }

        body::before {
            top: -13rem;
            left: -13rem;
            border-color: rgba(255, 71, 126, 0.2);
        }

        body::after {
            right: -13rem;
            bottom: -13rem;
        }

        main {
            width: min(42rem, calc(100% - 2rem));
            position: relative;
            padding: 3.5rem 3rem;
            text-align: center;
            border: 1px solid rgba(69, 243, 255, 0.7);
            background: linear-gradient(145deg, rgba(12, 18, 30, 0.96), rgba(7, 10, 18, 0.94));
            box-shadow:
                0 0 0 5px var(--background),
                0 0 0 6px rgba(255, 71, 126, 0.42),
                0 0 32px rgba(69, 243, 255, 0.14),
                0 24px 70px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
        }

        .sigil {
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1.5rem;
            display: grid;
            place-items: center;
            border: 1px solid var(--cyan);
            border-radius: 12px;
            color: var(--cyan);
            font: 700 1.55rem/1 "Trebuchet MS", sans-serif;
            letter-spacing: 0.06em;
            box-shadow:
                inset 0 0 0 4px var(--panel),
                inset 0 0 0 5px rgba(69, 243, 255, 0.35),
                0 0 26px rgba(69, 243, 255, 0.2),
                5px 5px 0 rgba(255, 71, 126, 0.5);
        }

        .eyebrow {
            margin: 0 0 0.6rem;
            color: var(--cyan);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f4fcff;
            font-family: "Arial Black", "Trebuchet MS", sans-serif;
            font-size: clamp(2.8rem, 10vw, 5.4rem);
            font-weight: 900;
            line-height: 0.94;
            letter-spacing: 0.035em;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 rgba(255, 71, 126, 0.7), -2px -2px 18px rgba(69, 243, 255, 0.28);
        }

        .title {
            margin: 1.1rem 0 2.2rem;
            color: var(--lime);
            font: 700 0.82rem/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .divider {
            width: 6.5rem;
            height: 1px;
            margin: 0 auto 2rem;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
            box-shadow: 0 0 14px rgba(69, 243, 255, 0.5);
        }

        .contacts {
            display: grid;
            gap: 0.75rem;
            max-width: 26rem;
            margin: 0 auto;
        }

        .contact {
            min-height: 2.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(69, 243, 255, 0.28);
            background: rgba(69, 243, 255, 0.025);
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.92rem;
            text-decoration: none;
            transition: border-color 180ms ease, color 180ms ease, background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .contact:hover,
        .contact:focus-visible {
            border-color: var(--cyan);
            color: var(--background);
            background: var(--cyan);
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(69, 243, 255, 0.35);
        }

        .label {
            margin-right: 0.55rem;
            color: var(--pink);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .contact:hover .label,
        .contact:focus-visible .label {
            color: var(--background);
        }

        @media (max-width: 520px) {
            body {
                place-items: start center;
                padding: 1.25rem 0;
            }

            main {
                width: calc(100% - 1.5rem);
                padding: 2.75rem 1.25rem;
            }

            .contact {
                align-items: flex-start;
                flex-direction: column;
                text-align: left;
            }

            .label {
                margin: 0 0 0.25rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="sigil" aria-hidden="true">SC</div>
        <p class="eyebrow">Personal Profile</p>
        <h1>Sunny Chen</h1>
        <div class="divider" aria-hidden="true"></div>

        <nav class="contacts" aria-label="Contact and social links">
            <a class="contact" href="mailto:sunnycnchen@gmail.com">
                <span class="label">Email</span>
                sunnycnchen@gmail.com
            </a>
            <a class="contact" href="tel:+886902182635">
                <span class="label">Phone</span>
                0902-182-635
            </a>
            <a class="contact" href="https://instagram.com/sunnysienchen" target="_blank" rel="noopener noreferrer">
                <span class="label">Instagram</span>
                @sunnysienchen
            </a>
            <a class="contact" href="https://www.tiktok.com/@laefeysun" target="_blank" rel="noopener noreferrer">
                <span class="label">TikTok</span>
                @laefeysun
            </a>
            <a class="contact" href="https://www.goodreads.com/user/show/185167760-sunny" target="_blank"
                rel="noopener noreferrer">
                <span class="label">Goodreads</span>
                View my reading list
            </a>
        </nav>
    </main>
</body>

</html>
